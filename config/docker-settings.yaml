# Container-specific runtime settings. The regular settings.yaml remains
# unchanged so the Windows start_all.cmd workflow still uses localhost.
project:
  name: Team 9 - Adaptive Traffic Signal Controller
  team: Team 9
  stage: simulator-and-mqtt

paths:
  dataset_csv: dataset/traffic_data.csv
  dataset_workbook: dataset/adaptive_traffic_project_dataset.xlsx
  models_dir: models
  results_dir: results

database:
  path: data/traffic.db

simulator:
  approaches: [North, South, East, West]
  interval_seconds: 60
  speed: 1.0
  loop: true
  invalid_row_policy: skip
  scenario: null

mqtt:
  host: mqtt
  port: 1883
  keepalive: 60
  client_id: team9-traffic-sim
  username: null
  password: null
  clean_session: true
  qos: 1
  retain: false
  reconnect_delay_seconds: 5
  reconnect_max_seconds: 60
  connect_timeout_seconds: 10
  ack_timeout_seconds: 5

controller:
  phase_order: [North, South, East, West]
  min_green_seconds: 10
  max_green_seconds: 60
  default_green_seconds: 25
  yellow_seconds: 3
  all_red_seconds: 2
  stale_after_seconds: 180
  score_queue_weight: 1.0
  score_arrival_weight: 1.0
  score_wait_weight: 0.5
  hold_band_seconds: 3
  tick_seconds: 0.5

actuator:
  ack_timeout_seconds: 2
  heartbeat_interval_seconds: 5
